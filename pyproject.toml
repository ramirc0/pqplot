[project]
name = "karyogram-plot"
version = "0.0.0"
description = "Chromosome ideograms and karyograms for matplotlib."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Ramirez", email = "christian.ramirez1@umassmed.edu" }]
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.10", "numpy>=2.2"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
exclude-newer = "7d"
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules"
filterwarnings = ["error"]
