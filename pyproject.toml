[project]
name = "pqplot"
version = "0.1.0"
description = "Chromosome ideograms and karyograms for matplotlib."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Ramirez", email = "christian.ramirez1@umassmed.edu" }]
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.10", "numpy>=2.2"]
keywords = ["ideogram", "karyogram", "karyotype", "chromosome", "genomics", "matplotlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/ramirc0/pqplot"
Issues = "https://github.com/ramirc0/pqplot/issues"
Changelog = "https://github.com/ramirc0/pqplot/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pandas>=3.1.1",
    "poikilos",
    "polars>=2.1.0",
    "pytest>=9.2",
    "pytest-mpl>=0.19",
    "ruff==0.17.4",
]

[tool.uv]
# uv.lock records these, and UV_EXCLUDE_NEWER and ~/.config/uv/uv.toml override them locally. They must match.
exclude-newer = "1 week"
exclude-newer-package = { certifi = false, pip = false }

[tool.uv.sources]
poikilos = { git = "https://github.com/ramirc0/poikilos" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules --mpl"
markers = ["images: compare rendered figures with tests/baseline"]
filterwarnings = ["error"]
